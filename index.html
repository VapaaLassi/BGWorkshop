<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Board Game Workshop</title>
    <style>
        /* General Page Styling */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
            color: #333;
            line-height: 1.6;
            margin: 0;
            padding: 20px;
        }

        h1 {
            text-align: center;
            color: #2c3e50;
            margin-top: 40px;
            border-bottom: 2px solid #3498db;
            display: inline-block;
            width: 100%;
            padding-bottom: 10px;
        }

        /* Container for the cards */
        #mechanics-container, #themes-container {
            display: grid;
            /* This creates a responsive grid: min 300px per card, otherwise fill space */
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
            margin-bottom: 50px;
            padding: 10px;
        }

        /* The "Jump Out" Card Style */
        .mechanic-card, .theme-card {
            background: #fff;
            border-radius: 12px;
            padding: 25px;
            /* The shadow creates the elevation */
            box-shadow: 0 10px 20px rgba(0,0,0,0.1);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            border: 1px solid #eee;
        }

            /* Hover effect to make it feel interactive */
            .mechanic-card:hover, .theme-card:hover {
                transform: translateY(-5px);
                box-shadow: 0 15px 30px rgba(0,0,0,0.15);
            }

        h3 {
            margin-top: 0;
            color: #2980b9;
        }

        p {
            font-style: italic;
            color: #555;
            flex-grow: 1;
        }

        /* Styling the Link as a Button */
        .mechanic-card a {
            display: inline-block;
            margin-top: 15px;
            padding: 10px 15px;
            background-color: #3498db;
            color: white;
            text-decoration: none;
            border-radius: 5px;
            text-align: center;
            font-weight: bold;
            transition: background 0.2s;
        }

            .mechanic-card a:hover {
                background-color: #2980b9;
            }

        /* Specific style for Theme cards since they are simpler */
        .theme-card {
            text-align: center;
            background: linear-gradient(135deg, #ffffff 0%, #ebf5fb 100%);
        }

        /* Mobile Adjustments */
        @media (max-width: 600px) {
            body {
                padding: 10px;
            }

            #mechanics-container, #themes-container {
                grid-template-columns: 1fr; /* Force single column on small screens */
            }
        }
    </style>
</head>
<body>

    <h1>Game Mechanics</h1>
    <div id="mechanics-container">
        <div id="mechanic0" class="mechanic-card"></div>
        <div id="mechanic1" class="mechanic-card"></div>
        <div id="mechanic2" class="mechanic-card"></div>
        <div id="mechanic3" class="mechanic-card"></div>
    </div>

    <h1>Themes</h1>
    <div id="themes-container">
        <div id="theme0" class="theme-card"></div>
        <div id="theme1" class="theme-card"></div>
    </div>

    <script>
        const csvData = `Stacking;The game uses stacking of game elements as a mechanic.
Conquering;Players can take over and hold territory in the game.
Flipping;Flipping gameplay elements over is a part of the game.
Combos;It is possible to combine gameplay elements in a way that makes them work particularly well together.
Currency;Currency and spending it is part of the game experience
Physical Space;The physical world is part of the game. Either through action (throwing, reaching, moving) or building something physically in the real world.
Building;Combining elements to build something where they work together as a whole.
Exploring;Making discoveries or moving around to find something.
Deduction;Combining information to solve a puzzle
Bluffing;Misrepresenting your abilities/resources or roles within the game.
Varying player powers;Players have somehow different skills from the beginning of the game.
Secret goals;Players have at least one goal that is hidden from other players that they are pursuing in addition to the main goal of the game.
Collecting;The players try to gather game elements together
Elimination;The game revolves around players getting eliminated from the game
Push your luck;The game has lements that drive players to take bigger and bigger risks, knowing that failure is an increasingly likely outcome.
Randomness;The element of randomness (through dice, cards, color of someone's shirt etc.) is central to the gameplay experience.
Inspired by real life;The game emulates or simulates something from the shared world we live in.
Worker Placement;Worker placement is a popular game mechanic where players assign their limited workers (meeples, tokens, or characters) to specific action spaces on the board. Each action provides unique benefits, but once a space is occupied, it’s usually blocked from other players until the next round, encouraging strategic decision-making and competitive planning.
Production;Producing resources is a central part of the game.
Tug of War;The game has elements that have two end points, where moving it towards one makes it further from the other.
Hidden information;There's information in the game that none of the players have at the beginning of the game.
Building the playfield;The area of play is created by the actions of the players.
King of the Hill;The players gain some type of advantage for occupying a specific part of the playfield. Or for holding some gameplay element that changes hands.
Connections;The game is about connecting elements together or creating chains from gameplay elements.
Alternative strategies;The game allows players to win the game with clearly different strategies.
Helping;Helping others is an element of the game
Reactions;Reacting quickly is a part of the game experience.
Short rounds;The game is composed of very short rounds.
Surprises;The game allows moments where something unexpected suddenly happens.
Auction;The game allows some type of bidding for gaining some type of resources or actions. This can be for example bidding from a limited amount of money or from a limited set of cards.
Teams;Some or all players play with other players. This can mean 1 vs 3 or that all players work toward a common goal.`;

        const themedata = `Fantasy
            Sci - fi
            Horror
            Fairytale
            Romance
            Medieval
The Victorian Era
            Internet & Cyberpunk
Time Travel
Natural Disaster
            Steampunk
Post Apocalypse
            School
            Circus
            Desert
            Arctic
            Underwater
            Jungle
            Utopia
            Dystopia
            Farming
            Gardening
            Mining
            Religion
            Food
            Music
            Art
            Family
            Sport
            Travel
            Heist
            Zombies
            Merchants
            Animals
            Wizards
            Spies
            Inventors
            Vikings
            Pirates
            Dreams
            Superheroes
            Detectives
Giant Monsters
            Finland
Game Industry`;
        // -------------------------------------------------------

        function parseCSV(data) {
            const rows = data.split('\n');
            const result = rows.map(row => row.split(';'));
            return result;
        }


        var parsedData = parseCSV(csvData);
        console.log(parsedData);

        const shuffled = [...parsedData].sort(() => 0.5 - Math.random());
        const selectedMechanics = shuffled.slice(0, 4);

        selectedMechanics.forEach((mechanic, index) => {
            const [name, summary, link] = mechanic;

            const container = document.getElementById(`mechanic${index}`);

            container.innerHTML = `
                <h3>${name}</h3>
                <p>${summary}</p>
        `;
        });

        const parsedThemes = parseCSV(themedata);

        console.log(parsedThemes);

        const shuffledThemes = [...parsedThemes].sort(() => 0.5 - Math.random());
        const selectedThemes = shuffledThemes.slice(0, 2);

        selectedThemes.forEach((theme, index) => {
            const name = theme;

            const container = document.getElementById(`theme${index}`);

            container.innerHTML = `
                <h3>${name}</h3>
        `;
        });
        //console.log(themedata);


    </script>

</body>
</html>
